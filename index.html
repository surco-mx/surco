<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surco</title>

<meta name="description" content="Surco: a crop-rotation decision-support tool built on NASA Earth observations.">
<meta name="theme-color" content="#1e6b47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surco">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout: a field app. Sticky top bar with the farm's location; four views (My field, Options, Map, Learn) switched by a
   bottom bar on phones and tabs on desktop; the location picker is a bottom sheet on phones and a dialog on desktop. */
:root {
  --bg: #eef1ea; --surface: #ffffff; --surface2: #e5eadf; --sunk: #f6f8f3; --fg: #17201a; --fg2: #56635a; --line: #d1d8ca; --grid: #e2e6dc;
  --accent: #1e6b47; --accentInk: #ffffff; --accentSoft: #d9ebdf; --maize: #c99512; --leaf: #3f8a3a; --rain: #2f6fb0; --et: #b2482a; --heat: #d2582a; --frost: #3d8fc4;
  --wet: rgba(47, 111, 176, 0.07); --bareFill: #e4ddd0; --up: #1e7a43; --down: #b23b2a; --warn: #a86a00; --scrim: rgba(12, 20, 14, 0.45); --shadow: 0 10px 30px rgba(20, 40, 25, 0.16);
  --display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --gut: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111612; --surface: #19201a; --surface2: #222b23; --sunk: #151b16; --fg: #e9eee6; --fg2: #a3b0a5; --line: #314034; --grid: #273127;
  --accent: #5fbf8a; --accentInk: #0e1a12; --accentSoft: #1f3a2a; --maize: #e2b33a; --leaf: #73b765; --rain: #6aa6e3; --et: #ee8a62; --heat: #f07a45; --frost: #74b9e6;
  --wet: rgba(106, 166, 227, 0.10); --bareFill: #3a342a; --up: #6ad28f; --down: #f08a73; --warn: #e6b04a; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111612; --surface: #19201a; --surface2: #222b23; --sunk: #151b16; --fg: #e9eee6; --fg2: #a3b0a5; --line: #314034; --grid: #273127;
  --accent: #5fbf8a; --accentInk: #0e1a12; --accentSoft: #1f3a2a; --maize: #e2b33a; --leaf: #73b765; --rain: #6aa6e3; --et: #ee8a62; --heat: #f07a45; --frost: #74b9e6;
  --wet: rgba(106, 166, 227, 0.10); --bareFill: #3a342a; --up: #6ad28f; --down: #f08a73; --warn: #e6b04a; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.in { max-width: 1180px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gutR) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15 }
h2 { font-size: 1.4rem; font-weight: 600 }
h3 { font-size: 1.1rem; font-weight: 600 }
p { margin: 0 }
a { color: var(--accent) }
.num, output { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--fg2) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; background: var(--accent); color: var(--accentInk); border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; cursor: pointer; text-decoration: none }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line) }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 0.88rem }
.btn.wide { width: 100% }
.btn[disabled] { opacity: 0.5; cursor: default }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; gap: 12px; min-height: 60px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex: none }
.brand svg { width: 34px; height: 34px }
.brand b { font-family: var(--display); font-size: 1.45rem; font-weight: 700 }
.placechip { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; max-width: 420px; min-height: 42px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunk); cursor: pointer; text-align: left }
.placechip .ic { color: var(--accent); width: 20px; height: 20px }
.placechip span { display: flex; flex-direction: column; min-width: 0; line-height: 1.2 }
.placechip b { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.placechip small { font-size: 0.74rem; color: var(--fg2); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none }
#langBtns { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
#langBtns button { background: transparent; border: 0; padding: 7px 11px; cursor: pointer; font-weight: 600; font-size: 0.82rem; min-height: 36px }
#langBtns button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }

/* navigation: tabs on desktop, bottom bar on phones */
.nav { display: flex; gap: 4px }
.nav a { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px 10px 0 0; color: var(--fg2); text-decoration: none; font-weight: 600; font-size: 0.92rem; border-bottom: 3px solid transparent }
.nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent) }
.nav a:hover { color: var(--fg) }

main.in { padding-block: 20px 40px }
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0 }
.sub { color: var(--fg2); margin: 6px 0 14px; max-width: 72ch; font-size: 0.93rem }
.scroll { overflow-x: auto }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2); font-weight: 600 }

/* field hero + stat tiles */
.hero { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px }
.hero h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 600 }
.hero .coords { color: var(--fg2); font-size: 0.85rem; margin-top: 4px }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.stat .lbl { font-size: 0.8rem; color: var(--fg2); font-weight: 600 }
.stat .val { font-family: var(--mono); font-size: 1.55rem; font-weight: 500; line-height: 1.15; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap }
.stat .val small { font-size: 0.85rem; color: var(--fg2) }
.stat .val .arrow { color: var(--fg2); font-size: 1rem }
.stat .val .hot { color: var(--heat) }
.stat .note { font-size: 0.78rem; color: var(--fg2) }
.stat.loading .val { color: var(--fg2); font-size: 1rem; font-family: var(--body) }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-radius: var(--r); background: var(--accent); color: var(--accentInk); text-decoration: none }
.cta b { font-family: var(--display); font-size: 1.25rem; font-weight: 600 }
.cta span { display: block; font-size: 0.88rem; opacity: 0.85 }

/* charts */
.yearsvg { width: 100%; min-width: 620px; display: block }
.yearsvg .mo { font: 600 12px var(--body); fill: var(--fg2) }
.yearsvg .ax { font: 10px var(--mono); fill: var(--fg2) }
.yearsvg .rl { font: 600 12px var(--body); fill: var(--fg) }
.yearsvg .rs { font: 11px var(--body); fill: var(--fg2) }
.yearsvg .cv { font: 500 11px var(--mono) }
.insights { margin: 14px 0 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 80ch }
.sparks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.spark { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--sunk); min-width: 0 }
.spark-h { display: flex; justify-content: space-between; gap: 8px; font-size: 0.84rem; font-weight: 600 }
.spark svg { width: 100%; height: auto; display: block; margin: 6px 0 }
.spark-f { display: flex; flex-direction: column; font-size: 0.8rem }
.spark-f .num { font-size: 0.95rem; font-weight: 500 }
.pill { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; align-self: start }
.pill.clear, .pill.high { background: var(--accent); color: var(--accentInk) }
.pill.possible, .pill.mid { background: color-mix(in srgb, var(--maize) 30%, transparent) }
.pill.none, .pill.low { border: 1px solid var(--line); color: var(--fg2) }

/* trust (ERA5) */
.trust { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: center }
.trust .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px }
.trust .pair { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.trust .pair dt { font-size: 0.76rem; color: var(--fg2) }
.trust .pair dd { margin: 2px 0 0; font-family: var(--mono); font-size: 1.05rem }
.trust svg { width: 100%; height: auto; display: block }
.trust svg text { font: 11px var(--body); fill: var(--fg2) }
.keyl { display: flex; gap: 14px; font-size: 0.8rem; color: var(--fg2); margin-top: 6px }
.keyl i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }

/* options view */
.optlayout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start }
.farmcard { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); max-height: calc(100vh - 140px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
.farmcard summary { list-style: none; cursor: pointer; padding: 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center }
.farmcard summary::-webkit-details-marker { display: none }
.farmcard summary h2 { font-size: 1.15rem }
.farmcard summary p { font-size: 0.82rem; color: var(--fg2); margin-top: 2px }
.farmcard summary .chev { transition: transform .2s; color: var(--fg2) }
.farmcard[open] summary .chev { transform: rotate(180deg) }
.farmbody { padding: 0 16px 18px }
.optmain { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.hint { font-size: 0.8rem; color: var(--fg2); margin: 4px 0 0 }
.hint.sat { color: var(--accent); font-weight: 600 }
fieldset { border: 0; padding: 0; margin: 16px 0 0; min-width: 0 }
legend { font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; padding: 0 }
.rotgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.sel { display: flex; flex-direction: column; gap: 3px; font-size: 0.74rem; color: var(--fg2); min-width: 0 }
.sel select, .mapctl select { width: 100%; min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); font-size: 0.88rem; color: var(--fg) }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg label { flex: 1; min-width: 0 }
.seg input { position: absolute; opacity: 0; pointer-events: none }
.seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 40px; padding: 6px 4px; font-size: 0.82rem; cursor: pointer; border-right: 1px solid var(--line); line-height: 1.2 }
.seg label:last-child span { border-right: 0 }
.seg input:checked + span { background: var(--fg); color: var(--bg); font-weight: 600 }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px }
.tog { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 0.88rem; cursor: pointer }
.tog input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip input { position: absolute; opacity: 0; pointer-events: none }
.chip span { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; cursor: pointer; color: var(--fg2); min-height: 32px }
.chip i { width: 9px; height: 9px; border-radius: 50%; opacity: 0.35 }
.chip input:checked + span { color: var(--fg); border-color: var(--fg2); background: var(--surface2) }
.chip input:checked + span i { opacity: 1 }
.chip input:focus-visible + span { outline: 2px solid var(--accent) }
.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px }
.goal { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); cursor: pointer; text-align: left; min-height: 84px }
.goal b { font-size: 0.92rem }
.goal span { font-size: 0.76rem; color: var(--fg2); line-height: 1.3 }
.goal[aria-pressed="true"] { border-color: var(--accent); background: var(--accentSoft); box-shadow: inset 0 0 0 1px var(--accent) }
details.fine { margin-top: 12px }
details.fine summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--accent) }
.prio { display: grid; grid-template-columns: 1fr 90px 18px; gap: 10px; align-items: center; font-size: 0.85rem; margin-top: 8px }
.prio input, .sliders input, .mdate input { accent-color: var(--accent); width: 100% }
.whatif { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; background: var(--surface2) }
.whatif .sub { margin-bottom: 0 }
.sliders { display: grid; gap: 14px }
.sliders label span { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem }
#optBusy:empty { display: none }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; transition: opacity .15s }
.busy .cards, .busy #yearBox { opacity: 0.55 }
.card { border: 1px solid var(--line); border-top: 5px solid var(--rc); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); min-width: 0 }
.card header { display: flex; justify-content: space-between; gap: 8px; font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase }
.card .role { font-weight: 700; color: var(--fg) }
.card .irr { color: var(--fg2); text-align: right }
.card h3 { font-size: 1.05rem; min-height: 2.6em }
.strip { width: 100%; height: auto; display: block }
.strip .mo2 { font: 9px var(--mono); fill: var(--fg2) }
.strip .cl { font: 600 10px var(--body) }
.scorerow { display: flex; gap: 14px; align-items: center }
.big { font-size: 2.2rem; font-weight: 500; line-height: 1 }
.big small { font-size: 0.85rem; color: var(--fg2) }
.rangebox { flex: 1; display: flex; flex-direction: column; gap: 3px; font-size: 0.75rem; min-width: 0 }
.rtrack { position: relative; height: 8px; background: var(--surface2); border-radius: 4px }
.rband { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--rc) 45%, transparent); border-radius: 4px }
.rmid { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--fg) }
.win { font-size: 0.8rem; color: var(--fg2) }
.fao { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.76rem }
.fao > span:first-child { color: var(--fg2); font-weight: 600 }
.fao .f { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap }
.fao .f.hi { background: color-mix(in srgb, var(--leaf) 20%, transparent); border-color: transparent }
.fao .f.mid { background: color-mix(in srgb, var(--maize) 22%, transparent); border-color: transparent }
.fao .f.lo { background: color-mix(in srgb, var(--down) 15%, transparent); border-color: transparent }
.bars { display: grid; gap: 5px }
.cb { display: grid; grid-template-columns: minmax(0, 1fr) 70px 26px; gap: 8px; align-items: center; font-size: 0.78rem }
.cb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cb.off { opacity: 0.45 }
.track { position: relative; height: 7px; background: var(--surface2); border-radius: 4px }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--rc); border-radius: 4px }
.ref { position: absolute; top: -3px; width: 2px; height: 13px; background: var(--fg) }
.cb b { font-weight: 500; text-align: right }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 }
.kpis div { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0 }
.kpis div:last-child:nth-child(odd) { grid-column: 1 / -1 }
.kpis dt { font-size: 0.72rem; color: var(--fg2); line-height: 1.25 }
.kpis dd { margin: 2px 0 0; font-size: 0.98rem }
.more { align-self: start; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; font-size: 0.84rem; font-weight: 600 }
.why h4 { font-family: var(--body); font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg2); margin: 12px 0 4px }
.why ul { margin: 0; padding-left: 1.1em; font-size: 0.88rem; display: grid; gap: 4px }
.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 0.86rem }
.cmp th, .cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
.cmp thead th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg2) }
.cmp td.num { text-align: right; white-space: nowrap }
.cmp .tot th, .cmp .tot td { border-bottom: 0; padding-top: 10px }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px }
.up { color: var(--up) } .down { color: var(--down) }

/* map */
.mapctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 10px }
.mapctl label { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--fg2); min-width: 0 }
.mdate { flex: 1 1 200px }
.zoom { display: flex; gap: 6px }
.map { position: relative; height: min(62vh, 520px); min-height: 300px; overflow: hidden; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line) }
.tiles img { position: absolute; image-rendering: pixelated; max-width: none }
.pin { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px #111, 0 2px 6px rgba(0,0,0,.4) }
.mapmsg { position: absolute; inset: auto 12px 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.86rem }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.78rem }
.legend i { width: 160px; height: 10px; border-radius: 5px; display: inline-block }
.legend .muted { flex-basis: 100%; font-family: var(--mono); font-size: 0.72rem; overflow-wrap: anywhere }

/* learn */
details.learn { border-top: 1px solid var(--line); padding: 12px 0 }
details.learn:last-of-type { border-bottom: 1px solid var(--line) }
details.learn summary { cursor: pointer; font-weight: 600 }
details.learn p { margin: 8px 0 0; max-width: 72ch; font-size: 0.93rem }
.method { padding-left: 1.2em; display: grid; gap: 8px; font-size: 0.9rem; max-width: 80ch; margin: 10px 0 0 }
.foot { padding-block: 0 28px }
.foot p { padding: 14px 18px; border-left: 4px solid var(--maize); background: var(--surface); border-radius: 0 var(--r) var(--r) 0; font-size: 0.93rem; max-width: 90ch }
.foot small { display: block; margin-top: 6px; color: var(--fg2) }

/* progress while studying a new place */
.progress { display: grid; gap: 10px }
.progress ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px }
.progress li { display: flex; gap: 10px; align-items: center; font-size: 0.92rem; color: var(--fg2) }
.progress li i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center }
.progress li.active { color: var(--fg); font-weight: 600 }
.progress li.active i { border-color: var(--accent); border-top-color: transparent; animation: spin 0.9s linear infinite }
.progress li.done { color: var(--fg) }
.progress li.done i { background: var(--accent); border-color: var(--accent) }
.progress li.done i::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accentInk); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px) }
.progress li.fail i { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, transparent) }
@keyframes spin { to { transform: rotate(360deg) } }

/* location sheet */
.sheetwrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px }
.sheethead { display: flex; justify-content: space-between; align-items: start; gap: 12px }
.sheethead h2 { font-size: 1.5rem }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none }
.locopts { display: grid; gap: 10px; margin-top: 14px }
.locopt { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--sunk); cursor: pointer; min-height: 64px }
.locopt .ico { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accentSoft); color: var(--accent) }
.locopt b { font-size: 1rem }
.locopt small { color: var(--fg2); font-size: 0.82rem }
.locopt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface) }
.locpanel { margin-top: 12px }
.locpanel:empty { display: none }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--fg2); font-weight: 600 }
.field input, .field textarea { min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); font-size: 1rem; color: var(--fg); font-weight: 400; width: 100% }
.field textarea { min-height: 88px; resize: vertical; font-family: var(--mono); font-size: 0.85rem }
.coordrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end }
.coordgrid { display: grid; gap: 12px }
.hem { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 46px }
.hem button { border: 0; background: transparent; padding: 0 12px; font-weight: 600; cursor: pointer; min-width: 64px; font-size: 0.85rem }
.hem button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
.helptext { font-size: 0.82rem; color: var(--fg2); margin-top: 8px }
.locstatus { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem }
.locstatus:empty { display: none }
.locstatus.err { background: color-mix(in srgb, var(--down) 12%, transparent) }
.locstatus.busy { background: var(--surface2) }
.found { margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--accentSoft); display: grid; gap: 10px }
.found .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.found .row .ic { color: var(--accent) }
.found b.num { font-size: 1rem }
.samples { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px }
.samples .chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; min-height: 40px; cursor: pointer; font-size: 0.84rem }
@keyframes up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow) }
.toast:empty { display: none }

@media (min-width: 900px) {
  .sheetwrap { align-items: center }
  .sheet { border-radius: 22px; padding: 22px 24px }
  .sheet .grab { display: none }
}
@media (max-width: 899px) {
  .appbar .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px var(--gutR) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut) }
  .nav a { flex: 1; flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 0.72rem; border-radius: 12px; border-bottom: 0; min-height: 52px; justify-content: center }
  .nav a[aria-current="page"] { background: var(--accentSoft) }
  .navrow { display: contents }
  main.in { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  .foot { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  .stats { grid-template-columns: 1fr 1fr }
  .optlayout { grid-template-columns: minmax(0, 1fr) }
  .farmcard { position: static; max-height: none }
  .goals { grid-template-columns: 1fr 1fr }
  .whatif, .trust { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 520px) {
  .brand b { display: none }
  .block { padding: 16px }
  .kpis { grid-template-columns: 1fr }
  .stat .val { font-size: 1.3rem }
  .hero .btn { width: 100% }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }

// Converts a NASA POWER daily point response into the compact climate profile used by Field Shift.
// Same function runs live in the app and was used to precompute the preset sites.
function fsSummarize(j, lat) {
  const pp = j.properties.parameter;
  const days = Object.keys(pp.T2M_MAX).sort();
  const y0 = +days[0].slice(0, 4), y1 = +days[days.length - 1].slice(0, 4);
  const nY = y1 - y0 + 1;
  const rad = Math.PI / 180;
  const ok = v => v !== undefined && v !== null && v > -998;
  const M = []; // per year-month accumulators
  for (let i = 0; i < nY * 12; i++) M.push({ n: 0, P: 0, Tx: 0, Tn: 0, HD: 0, FD: 0, CD: 0, SMr: 0, SMt: 0, ET: 0, ET0: 0, RS: 0, H25: 0 });
  const frostSpring = [], frostFall = [], dry = new Array(nY).fill(0);
  let curDry = 0, lastY = null, lastSpring = null, firstFall = null;
  for (const d of days) {
    const y = +d.slice(0, 4), m = +d.slice(4, 6), dd = +d.slice(6, 8);
    if (y !== lastY) {
      if (lastY !== null) { if (lastSpring) frostSpring.push(lastSpring); if (firstFall) frostFall.push(firstFall); }
      lastY = y; lastSpring = null; firstFall = null; curDry = 0;
    }
    const doy = Math.round((Date.UTC(y, m - 1, dd) - Date.UTC(y, 0, 0)) / 864e5);
    const tx = pp.T2M_MAX[d], tn = pp.T2M_MIN[d], p = pp.PRECTOTCORR[d];
    if (!ok(tx) || !ok(tn) || !ok(p)) continue;
    const o = M[(y - y0) * 12 + m - 1];
    o.n++; o.P += p; o.Tx += tx; o.Tn += tn;
    if (p >= 25) o.H25++;
    if (tx >= 35) o.HD++;
    if (tn <= 0) o.FD++;
    if (tn <= 3) o.CD++;
    o.SMr += ok(pp.GWETROOT[d]) ? pp.GWETROOT[d] : 0;
    o.SMt += ok(pp.GWETTOP[d]) ? pp.GWETTOP[d] : 0;
    o.ET += ok(pp.EVPTRNS[d]) ? pp.EVPTRNS[d] / 2.45 : 0; // MJ/m2/day -> mm/day (latent heat 2.45 MJ/kg)
    o.RS += ok(pp.ALLSKY_SFC_SW_DWN[d]) ? pp.ALLSKY_SFC_SW_DWN[d] : 0;
    // Hargreaves-Samani reference ET (FAO-56 eq. 52) with extraterrestrial radiation from latitude
    const phi = lat * rad, dr = 1 + 0.033 * Math.cos(2 * Math.PI * doy / 365), dec = 0.409 * Math.sin(2 * Math.PI * doy / 365 - 1.39);
    const ws = Math.acos(Math.max(-1, Math.min(1, -Math.tan(phi) * Math.tan(dec))));
    const Ra = 24 * 60 / Math.PI * 0.082 * dr * (ws * Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.sin(ws));
    o.ET0 += 0.0023 * ((tx + tn) / 2 + 17.8) * Math.sqrt(Math.max(0, tx - tn)) * 0.408 * Ra;
    // warm-season dry spell (days < 2 mm in the 4 wettest-season months of the hemisphere)
    const wet = lat >= 0 ? (m >= 6 && m <= 9) : (m === 12 || m <= 3);
    if (wet) { if (p < 2) { curDry++; dry[y - y0] = Math.max(dry[y - y0], curDry); } else curDry = 0; }
    // frost dates (NH logic: spring = Jan-Jun, fall = Jul-Dec)
    if (tn <= 0) { if (m <= 6) lastSpring = doy; else if (!firstFall) firstFall = doy; }
  }
  if (lastSpring) frostSpring.push(lastSpring); if (firstFall) frostFall.push(firstFall);
  const r = (x, k = 1) => +x.toFixed(k);
  const mean = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  const pct = (a, q) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(q * (s.length - 1))]; };
  const clim = { P: [], Pp20: [], Tx: [], Tn: [], HD: [], FD: [], CD: [], SMr: [], SMt: [], ET: [], ET0: [], RS: [], H25: [] };
  for (let m = 0; m < 12; m++) {
    const rows = []; for (let y = 0; y < nY; y++) { const o = M[y * 12 + m]; if (o.n) rows.push(o); }
    const tot = k => rows.map(o => o[k]);
    const avg = k => rows.map(o => o[k] / o.n);
    clim.P.push(r(mean(tot('P')))); clim.Pp20.push(r(pct(tot('P'), 0.2)));
    clim.Tx.push(r(mean(avg('Tx')))); clim.Tn.push(r(mean(avg('Tn'))));
    clim.HD.push(r(mean(tot('HD')))); clim.FD.push(r(mean(tot('FD')))); clim.CD.push(r(mean(tot('CD'))));
    clim.H25.push(r(mean(tot('H25')), 2));
    clim.SMr.push(r(mean(avg('SMr')), 3)); clim.SMt.push(r(mean(avg('SMt')), 3));
    clim.ET.push(r(mean(avg('ET')))); clim.ET0.push(r(mean(tot('ET0')) / 30.4, 1)); clim.RS.push(r(mean(avg('RS'))));
  }
  const annual = { years: [], P: [], Tx: [], HD: [], FD: [], SMr: [], ET0: [], dry: [] };
  for (let y = 0; y < nY; y++) {
    const ms = M.slice(y * 12, y * 12 + 12).filter(o => o.n);
    if (ms.length < 12) continue;
    annual.years.push(y0 + y);
    annual.P.push(r(ms.reduce((s, o) => s + o.P, 0), 0));
    annual.Tx.push(r(mean(ms.map(o => o.Tx / o.n))));
    annual.HD.push(ms.reduce((s, o) => s + o.HD, 0));
    annual.FD.push(ms.reduce((s, o) => s + o.FD, 0));
    annual.SMr.push(r(mean(ms.map(o => o.SMr / o.n)), 3));
    annual.ET0.push(r(ms.reduce((s, o) => s + o.ET0, 0), 0));
    annual.dry.push(dry[y]);
  }
  return {
    lat, lon: +j.geometry.coordinates[0].toFixed(2), period: `${y0}-${y1}`, clim, annual,
    monthlyP: M.filter(o => o.n).map(o => r(o.P, 0)),
    monthlySM: M.filter(o => o.n).map(o => r(o.SMr / o.n, 2)),
    frost: { lastSpring: median(frostSpring), firstFall: median(frostFall), yearsWithFrost: frostSpring.length }
  };
}

window.fsSummarize = fsSummarize;
</script>

/* Surco extra data: SRTM terrain, ERA5 cross-check and FAO GAEZ crop suitability.

(function (root) {
  'use strict';

  /* ---------- SRTM elevation & slope ----------

  async function fetchTerrain(lat, lon) {
    const z = 12, n = 2 ** z, lr = lat * Math.PI / 180;
    const fx = (lon + 180) / 360 * n, fy = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;

    const cv = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(512, 512) : Object.assign(document.createElement('canvas'), { width: 512, height: 512 });
    const g = cv.getContext('2d', { willReadFrequently: true });

      const r = await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${((ox + dx) % n + n) % n}/${oy + dy}.png`);

      if ((x - px) ** 2 + (y - py) ** 2 > R * R || x < 1 || y < 1 || x > 510 || y > 510) continue;

      const dzdx = ((H(x + 1, y - 1) + 2 * H(x + 1, y) + H(x + 1, y + 1)) - (H(x - 1, y - 1) + 2 * H(x - 1, y) + H(x - 1, y + 1))) / (8 * cell);

      elevation: Math.round(H(px, py)), slopePct,
      relief: Math.round(elev[elev.length - 1] - elev[0]), radiusM: Math.round(R * cell),

    const m = s.match(dms);

<script>
/* Plain-language glossary and method notes, both languages. */
window.SURCO_LEARN = {
  en: [
    ['Evapotranspiration (ET) and reference ET (ET₀)', 'Water leaves a field two ways: evaporation from the soil and transpiration through leaves. Together they are evapotranspiration. Reference ET (ET₀) is how much a short, well-watered grass would use under the day’s heat, sun and wind. A crop uses ET₀ times a crop coefficient (Kc): maize at full canopy uses about 1.2 × ET₀. Surco estimates ET₀ from NASA POWER daily max and min temperature and the sun’s geometry (Hargreaves–Samani, FAO-56 eq. 52).'],
    ['Water balance', 'Each month the soil gains infiltrated rain (and irrigation) and loses crop water use, bare-soil evaporation and drainage once it is full. The soil can only hold so much: about 60 mm in the root zone of a sandy soil, 110 mm in a loam and 150 mm in a clay. When the crop asks for more than the soil holds, it is stressed, and yield falls according to the FAO-33 yield response factor (Ky).'],
    ['NDVI (vegetation index)', 'Healthy leaves reflect a lot of near-infrared light and absorb red light. NDVI = (NIR − Red) / (NIR + Red) turns that into a number from about 0 (bare soil) to 0.9 (dense green crop). Surco reads 16-day MODIS NDVI composites (250 m pixels) for 2021–2025 and marks a month as bare when NDVI stays in the lowest third of the field’s own seasonal range.'],
    ['Soil moisture and “soil wetness”', 'Root-zone soil wetness from NASA POWER (MERRA-2 model) is a 0–1 index of how full the top metre of soil is. SMAP satellites measure the top ~5 cm with microwaves and feed a model that estimates the root zone (SMAP L4), shown in the map layers. Both describe a grid cell of several kilometres, not your exact field.'],

  es: [
    ['Evapotranspiración (ET) y ET de referencia (ET₀)', 'El agua sale de la parcela de dos formas: se evapora del suelo y la transpiran las hojas. Juntas forman la evapotranspiración. La ET de referencia (ET₀) es lo que gastaría un pasto corto bien regado con el calor, el sol y el viento del día. Un cultivo gasta ET₀ por un coeficiente de cultivo (Kc): el maíz en plena cobertura gasta cerca de 1.2 × ET₀. Surco estima la ET₀ con la temperatura máxima y mínima diaria de NASA POWER y la posición del sol (Hargreaves–Samani, FAO-56 ec. 52).'],
    ['Balance de agua', 'Cada mes el suelo gana la lluvia que se infiltra (y el riego) y pierde lo que usa el cultivo, lo que se evapora del suelo desnudo y lo que drena cuando ya está lleno. El suelo solo guarda cierta cantidad: unos 60 mm en la zona de raíces de un suelo arenoso, 110 mm en uno franco y 150 mm en uno arcilloso. Cuando el cultivo pide más de lo que hay, se estresa y el rendimiento baja según el factor de respuesta FAO-33 (Ky).'],
    ['NDVI (índice de vegetación)', 'Las hojas sanas reflejan mucha luz infrarroja cercana y absorben luz roja. NDVI = (NIR − Rojo) / (NIR + Rojo) lo convierte en un número de casi 0 (suelo desnudo) a 0.9 (cultivo verde y denso). Surco lee compuestos NDVI de MODIS de 16 días (píxeles de 250 m) de 2021 a 2025 y marca un mes como desnudo cuando el NDVI queda en el tercio más bajo del rango propio de la parcela.'],

<script>
/* Surco interface: state, rendering, charts, explanations, live NASA access. */
(function () {
  'use strict';
  const E = window.SurcoEngine, TX = window.SURCO_TEXT, CT = window.SURCO_CROPS_TEXT, DATA = window.SURCO_DATA;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = { en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], es: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'] };
  const CROP_COLOR = { maize: '#d9a21b', milpa: '#b98a2a', sorghum: '#a4532e', bean: '#7d3b32', cowpea: '#a26d4c', soybean: '#8aa142', sunflower: '#e8bd2c', amaranth: '#b33a63', sunnhemp: '#d8b53d', wheat: '#c8a464', wwheat: '#b99551', barley: '#d4b98c', oats: '#97b073', chickpea: '#c39a6f', safflower: '#e07b39', vetch: '#7a6cb3', rye: '#6d8b5a', mucuna: '#4d7039' };
  const CRIT = E.CRITERIA;

  const PRESETS = {
    morelos: { lat: 18.69, lon: -99.12, current: ['maize', 'fallow', 'maize', 'fallow'],
      opts: { soil: 'clay', slope: 'gentle', residue: 'removed', irrigation: 'none', livestock: true, keepMain: true, market: ['maize', 'milpa', 'sorghum', 'bean', 'amaranth', 'oats', 'chickpea'] },
      weights: { water: 2, soil: 4, erosion: 3, income: 4, pest: 3, stability: 4, forage: 2 } },
    bajio: { lat: 20.45, lon: -100.9, current: ['sorghum', 'fallow', 'maize', 'fallow'],
      opts: { soil: 'clay', slope: 'flat', residue: 'left', irrigation: 'limited', livestock: false, keepMain: false, market: ['maize', 'milpa', 'sorghum', 'bean', 'wheat', 'barley', 'oats', 'chickpea', 'safflower', 'soybean'] },
      weights: { water: 4, soil: 3, erosion: 2, income: 4, pest: 3, stability: 3, forage: 0 } },
    kansas: { lat: 37.85, lon: -101.0, current: ['maize', 'fallow', 'maize', 'fallow'],
      opts: { soil: 'loam', slope: 'flat', residue: 'left', irrigation: 'full', livestock: false, keepMain: false, market: ['maize', 'sorghum', 'wwheat', 'soybean', 'sunflower'] },
      weights: { water: 5, soil: 3, erosion: 2, income: 4, pest: 2, stability: 3, forage: 0 } }
  };

  let lang = 'en';
  try { const sv = localStorage.getItem('surco-lang'); if (sv === 'es' || sv === 'en') lang = sv; else if ((navigator.language || '').startsWith('es')) lang = 'es'; } catch (e) { }
  const t = (k, a) => { let s = (TX[lang] && TX[lang][k]) || TX.en[k] || k; if (a) for (const [x, v] of Object.entries(a)) s = s.split('{' + x + '}').join(v); return s; };
  const cropName = k => (CT[k] && CT[k][lang]) || k;

  const S = { siteKey: 'morelos', site: null, current: null, opts: null, weights: null, rainPct: 0, dT: 0, results: null, open: {}, custom: null, extras: null, extrasState: null, progress: null, slopeTouched: false, farmOpen: false };

  function loadSite(key, raw, ndvi, preset) {
    S.siteKey = key;
    S.site = E.prepareSite(raw, ndvi);
    const p = JSON.parse(JSON.stringify(preset));
    S.current = p.current; S.opts = p.opts; S.weights = p.weights;
    // make sure the current rotation only uses crops valid here
    const warmOK = k => E.allowed(S.site, k, 'warm'), coolOK = k => E.allowed(S.site, k, 'cool');
    if (!warmOK(S.current[0])) S.current[0] = 'maize'; if (!warmOK(S.current[2])) S.current[2] = 'maize';
    if (!coolOK(S.current[1])) S.current[1] = 'fallow'; if (!coolOK(S.current[3])) S.current[3] = 'fallow';
    S.open = {};
  }

  /* ---------------- formatting helpers ---------------- */
  const f0 = x => Math.round(x).toLocaleString(lang === 'es' ? 'es-MX' : 'en-US');
  const f1 = x => (Math.round(x * 10) / 10).toLocaleString(lang === 'es' ? 'es-MX' : 'en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const sgn = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + Math.abs(x);
  function monthRuns(flags) { // ["Jan–May", "Nov"] for a 12-month boolean list (wraps around)
    const M = MONTHS[lang]; if (flags.every(Boolean)) return [M[0] + '–' + M[11]];
    let s = flags.findIndex(f => !f); const runs = [];
    for (let i = 1; i <= 12; i++) { const m = (s + i) % 12; if (flags[m] && !flags[(m + 11) % 12]) { let e = m; while (flags[(e + 1) % 12] && (e + 1) % 12 !== m) e = (e + 1) % 12; runs.push(m === e ? M[m] : M[m] + '–' + M[e]); } }
    return runs;
  }
  const joinList = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + (lang === 'es' ? ' y ' : ' and ') + a[a.length - 1];
  const doyLabel = d => { if (d == null) return '–'; const dt = new Date(Date.UTC(2021, 0, d)); return dt.getUTCDate() + ' ' + MONTHS[lang][dt.getUTCMonth()]; };
  const ink = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1b1f17' : '#fffdf6'; };

  /* ---------------- computation ---------------- */
  function compute() {
    const site = S.site, scn = E.scenario(site, S.rainPct, S.dT);
    const cur = E.simulate(site, S.current, S.opts, scn);
    if (!cur) { S.results = { error: true }; return; }
    cur.role = 'current'; cur.irrigation = S.opts.irrigation; cur.total = E.total(cur.scores, S.weights);
    const rec = E.recommend(site, S.current, S.opts, S.weights, scn);
    const items = [cur, ...rec.picks];
    const unc = E.uncertainty(site, items, S.opts, S.weights, scn, 250);
    items.forEach((it, i) => { it.unc = unc[i]; it.stress = E.stressTest(it, site); });
    S.results = { items, scn, evaluated: rec.evaluated };
  }

  /* ---------------- explanations ---------------- */
  function bareCovered(item) {
    const site = S.site; if (!site.bare) return null;
    let bareN = 0, covered = 0;
    for (let m = 0; m < 12; m++) { if (!site.bare[m]) continue; bareN++; const t1 = (m - site.warmStart + 12) % 12; covered += ((item.cover[t1] >= 0.25) + (item.cover[t1 + 12] >= 0.25)) / 2; }
    return { bareN, covered };
  }
  function cropWaterLines(item) {
    const out = [], seen = {};
    item.plantings.forEach(p => { const cr = E.CROPS[p.key]; if (cr.fallow || !p.sat.length || seen[p.key]) return; seen[p.key] = 1;
      const all = item.plantings.filter(q => q.key === p.key).flatMap(q => q.sat); const ok = Math.round(all.filter(s => s >= 0.8).length / all.length * p.sat.length);
      out.push(lang === 'es' ? `${cropName(p.key)}: el agua necesaria se cubrió al 80% o más en ${ok} de ${p.sat.length} años${p.heatDays > 10 ? `; enfrenta ~${f0(p.heatDays)} días ≥35 °C por ciclo` : ''}.`
        : `${cropName(p.key)}: water need at least 80% met in ${ok} of ${p.sat.length} years${p.heatDays > 10 ? `; faces ~${f0(p.heatDays)} days ≥35 °C per season` : ''}.`); });
    return out;
  }
  function explain(item, cur) {
    const site = S.site, es = lang === 'es', why = [], ev = [], ben = [], gaps = [], rev = [];
    const keys = item.plantings.map(p => p.key), curKeys = cur.plantings.map(p => p.key);
    const added = [...new Set(keys.filter(k => !curKeys.includes(k) && k !== 'fallow'))];
    const isCur = item === cur;
    if (isCur) {
      const sameFam = item.metrics.sameFamilyPairs > 0;
      why.push(es ? 'Es tu punto de partida: así se comparan las demás opciones.' : 'This is your starting point; every other option is compared with it.');
      if (sameFam) why.push(es ? 'Repite cultivos de la misma familia, lo que permite que plagas y enfermedades se acumulen de un año a otro.' : 'It repeats crops from the same family, which lets pests and diseases carry over from one year to the next.');
    } else {
      const roleWhy = {
        balanced: es ? 'Es la combinación con mejor puntaje total según tus prioridades.' : 'It has the highest overall score for the priorities you set.',
        soil: es ? 'Es la opción que más alimenta y protege el suelo sin bajar el puntaje total respecto a tu rotación actual.' : 'It feeds and protects the soil the most without scoring lower overall than your current rotation.',
        water: es ? 'Es la opción que menos agua de riego usa sin bajar el puntaje total respecto a tu rotación actual.' : 'It uses the least irrigation water without scoring lower overall than your current rotation.',
        income: es ? 'Es la opción con más ingreso esperado sin bajar el puntaje total respecto a tu rotación actual.' : 'It has the best expected income without scoring lower overall than your current rotation.'
      };
      why.push(roleWhy[item.role]);
      for (const k of added) {
        const cr = E.CROPS[k], bits = [];
        if (cr.relay) { const host = item.plantings.find(p => p.slot === item.plantings.find(q => q.key === k).slot - 1); bits.push(es ? `se siembra en relevo dentro del ${cropName(host.key).toLowerCase()} para aprovechar las últimas lluvias` : `is relay-sown into the standing ${cropName(host.key).toLowerCase()} to use the last rains`); }
        if (cr.cover) bits.push(es ? 'deja raíces vivas y cubre el suelo en meses que hoy están desnudos' : 'keeps living roots and ground cover in months that are now bare');
        if (cr.fam.includes('Fabaceae')) bits.push(es ? 'es leguminosa y fija parte de su propio nitrógeno' : 'is a legume that fixes part of its own nitrogen');
        if (cr.root >= 0.9) bits.push(es ? 'tiene raíces profundas que alcanzan agua y aflojan el subsuelo' : 'has deep roots that reach stored water and loosen subsoil');
        if (cr.heat <= 0.3 && cr.ky <= 0.9) bits.push(es ? 'tolera calor y periodos secos' : 'tolerates heat and dry spells');
        if (cr.season === 'cool' && !cr.cover) bits.push(es ? 'usa la humedad que queda en el suelo (o riego) después de la cosecha principal' : 'uses moisture left in the soil (or irrigation) after the main harvest');
        if (!cr.fam.some(f => curKeys.some(c => E.CROPS[c].fam.includes(f)))) bits.push(es ? 'es de otra familia, así corta el ciclo de plagas del cultivo actual' : 'belongs to a different family, which breaks the pest cycle of the current crop');
        if (bits.length) why.push(`${cropName(k)} ${joinList(bits)}.`);
      }
      if (item.irrigation !== cur.irrigation) why.push(es ? `Cambia el riego de “${t('irr' + cap(cur.irrigation))}” a “${t('irr' + cap(item.irrigation))}”.` : `Changes irrigation from “${t('irr' + cap(cur.irrigation))}” to “${t('irr' + cap(item.irrigation))}”.`);
      const gains = CRIT.map(c => [c, item.scores[c] - cur.scores[c]]).filter(([c, d]) => d >= 5 && S.weights[c] > 0).sort((a, b) => b[1] * S.weights[b[0]] - a[1] * S.weights[a[0]]).slice(0, 3);
      if (gains.length) why.push((es ? 'Sube más que tu rotación actual en: ' : 'Scores higher than your current rotation on: ') + gains.map(([c, d]) => `${t('c_' + c).toLowerCase()} (+${f0(d)})`).join(', ') + '.');
      const losses = CRIT.map(c => [c, item.scores[c] - cur.scores[c]]).filter(([c, d]) => d <= -5 && S.weights[c] > 0);
      if (losses.length) why.push((es ? 'Cede en: ' : 'Gives up some: ') + losses.map(([c, d]) => `${t('c_' + c).toLowerCase()} (${'−' + f0(-d)})`).join(', ') + '.');
    }
    // evidence
    ev.push(...cropWaterLines(item));
    const gz = (S.extras || {}).gaez;
    if (gz) { const lvl = S.opts.irrigation === 'full' ? 'high' : 'low'; const lst = [...new Set(keys)].map(k => { const v = X.gaezFor(gz, k, lvl); return v == null ? null : `${cropName(k).split(' (')[0]} ${v}/100`; }).filter(Boolean); if (lst.length) ev.push(t('ev_fao', { list: joinList(lst) })); }
    const bc = bareCovered(item);
    if (bc && bc.bareN) ev.push(es ? `MODIS muestra ${bc.bareN} meses con la parcela desnuda; esta rotación mantiene cubiertos en promedio ${bc.covered % 1 ? f1(bc.covered) : f0(bc.covered)} de ellos.` : `MODIS shows ${bc.bareN} months when the field is bare; this rotation keeps ${bc.covered % 1 ? f1(bc.covered) : f0(bc.covered)} of them covered on average.`);
    const tr = site.trends;
    if (tr.Tx.p < 0.2) ev.push(es ? `La máxima diaria sube ${f1(tr.Tx.perDecade)} °C por década (${tr.Tx.p < 0.001 ? 'p < 0.001' : 'p = ' + tr.Tx.p.toFixed(3)}), lo que favorece cultivos que toleran calor.` : `Daily max temperature is rising ${f1(tr.Tx.perDecade)} °C per decade (${tr.Tx.p < 0.001 ? 'p < 0.001' : 'p = ' + tr.Tx.p.toFixed(3)}), which favours heat-tolerant crops.`);
    if (item.stress) ev.push(es ? `En ${item.stress.year}, el año más seco del registro, esta rotación habría dado ${f0(item.stress.ratio * 100)}% de su ingreso promedio.` : `In ${item.stress.year}, the driest year on record, this rotation would have earned ${f0(item.stress.ratio * 100)}% of its average income.`);
    // benefits
    if (!isCur) {

    const x0 = Math.floor((cx - W / 2) / ts), x1 = Math.floor((cx + W / 2) / ts), y0 = Math.floor((cy - H / 2) / ts), y1 = Math.floor((cy + H / 2) / ts);

  /* ---------------- live NDVI from NASA GIBS ---------------- */
  async function liveNdvi(lat, lon, progress) {
    const cm = await (await fetch('https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_L3_NDVI.xml')).text();
    const doc = new DOMParser().parseFromString(cm, 'application/xml'), map = {};
    for (const e of doc.getElementsByTagName('ColorMapEntry')) { const v = e.getAttribute('value'); const m = v && v.match(/\[([-\d.]+),([-\d.]+)\)/); if (m) map[e.getAttribute('rgb')] = (+m[1] + +m[2]) / 2; }
    const z = 9, n = 2 ** z, lr = lat * Math.PI / 180, x = (lon + 180) / 360 * n, y = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
    const tx = Math.floor(x), ty = Math.floor(y), px = Math.floor((x % 1) * 256), py = Math.floor((y % 1) * 256);
    const dates = []; for (let yr = 2021; yr <= 2025; yr++) for (let d = 1; d <= 353; d += 16) dates.push(new Date(Date.UTC(yr, 0, d)).toISOString().slice(0, 10));
    const out = new Array(dates.length).fill(null); let done = 0;
    const one = async i => {
      const r = await fetch(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_L3_NDVI_16Day/default/${dates[i]}/GoogleMapsCompatible_Level9/${z}/${ty}/${tx}.png`);
      if (r.ok) { const bm = await createImageBitmap(await r.blob()); const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'); g.drawImage(bm, 0, 0);
        const vals = []; for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const p = g.getImageData(Math.min(255, Math.max(0, px + dx)), Math.min(255, Math.max(0, py + dy)), 1, 1).data; if (p[3] === 0) continue; const v = map[p[0] + ',' + p[1] + ',' + p[2]]; if (v !== undefined && v > 0) vals.push(v); }
        if (vals.length) { vals.sort((a, b) => a - b); out[i] = +vals[Math.floor(vals.length / 2)].toFixed(3); } }
      progress(++done, dates.length);
    };
    for (let i = 0; i < dates.length; i += 8) await Promise.all(dates.slice(i, i + 8).map((_, k) => one(i + k).catch(() => progress(++done, dates.length))));
    return out.filter(v => v != null).length > 20 ? out : null;
  }

    $('#cards').innerHTML = R.items.map((it, i) => card(it, cur, i)).join('');
    const heads = R.items.map(it => `<th scope="col"><span class="dot" style="background:${roleColor(it.role)}"></span>${esc(t('role_' + it.role))}</th>`).join('');
    const rows = CRIT.map(c => `<tr><th scope="row">${esc(t('c_' + c))}${S.weights[c] === 0 ? ` <span class="muted">(0)</span>` : ''}</th>${R.items.map(it => { const d = it.scores[c] - cur.scores[c]; return `<td class="num">${f0(it.scores[c])}${it === cur ? '' : ` <span class="${d >= 5 ? 'up' : d <= -5 ? 'down' : 'muted'}">${d >= 0.5 || d <= -0.5 ? sgn(f0(d)) : ''}</span>`}</td>`; }).join('')}</tr>`).join('');
    $('#cmp').innerHTML = `<table class="cmp"><thead><tr><th scope="col">${esc(t('crit'))}</th>${heads}</tr></thead><tbody>${rows}
        <tr class="tot"><th scope="row">${esc(t('score'))}</th>${R.items.map(it => `<td class="num"><b>${f0(it.total)}</b> <span class="muted">${f0(it.unc.p10)}–${f0(it.unc.p90)}</span></td>`).join('')}</tr></tbody></table>`;
    const fs = $('#farmSum'); if (fs) fs.textContent = farmSummary();
    if ($('#yearBox') && VIEW === 'parcela') $('#yearBox').innerHTML = yearChart();
  }
  function faoRow(it) {
    const g = (S.extras || {}).gaez; if (!g) return '';
    const lvl = S.opts.irrigation === 'full' ? 'high' : 'low';
    const seen = {}, chips = [];
    it.plantings.forEach(p => { if (seen[p.key]) return; seen[p.key] = 1; const v = X.gaezFor(g, p.key, lvl); if (v == null) return; const c = v >= 55 ? 'hi' : v >= 25 ? 'mid' : 'lo'; chips.push(`<span class="f ${c}" title="FAO GAEZ ${v}/100">${esc(cropName(p.key).split(' (')[0])} ${v}</span>`); });
    return chips.length ? `<div class="fao"><span>${esc(t('faoLabel'))}</span>${chips.join('')}</div>` : '';
  }

  /* ---------- views: map + learn ---------- */
  function renderMapa() { $('#v-mapa').innerHTML = `<section class="block"><h2>${esc(t('s_map'))}</h2><p class="sub">${esc(t('s_mapSub'))}</p><div id="mapWrap"></div></section>`; if (VIEW === 'mapa') renderMap(); }
  function renderAprende() {
    $('#v-aprende').innerHTML = `<section class="block"><h2>${esc(t('s_install'))}</h2><p class="sub" style="margin-bottom:0">${esc(t('installTxt'))}</p></section>
      <section class="block"><h2>${esc(t('s_learn'))}</h2>${window.SURCO_LEARN[lang].map(([h, b]) => `<details class="learn"><summary>${esc(h)}</summary><p>${esc(b)}</p></details>`).join('')}</section>
      <section class="block"><h2>${esc(t('s_method'))}</h2><ol class="method">${window.SURCO_METHOD[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
  }

  /* ---------- progress while studying a place ---------- */
  const STEPS = ['power', 'ndvi', 'terrain', 'era5', 'gaez'];
  function progressBlock() {
    const P = S.progress;
    return `<section class="block progress" aria-live="polite"><h2>${esc(t('studying'))}</h2><p class="sub" style="margin:0">${esc(t('studyingSub'))}</p>
      <ol>${STEPS.map(k => `<li class="${P[k] || ''}"><i></i>${esc(t('st_' + k))}${k === 'ndvi' && P.ndviN ? ` <span class="num muted">${P.ndviN}</span>` : ''}</li>`).join('')}</ol></section>`;
  }
  function setStep(k, st, extra) { if (!S.progress) return; S.progress[k] = st; if (extra) Object.assign(S.progress, extra); const box = $('#v-parcela .progress'); if (box) box.outerHTML = progressBlock(); }

  /* ---------- extra datasets (SRTM, ERA5, GAEZ) ---------- */
  function applyExtras() {
    const ex = S.extras || {};
    if (ex.terrain && !S.slopeTouched) S.opts.slope = ex.terrain.slopeClass;
    S.site.rainUnc = ex.era5 ? Math.max(0.05, Math.min(0.3, Math.abs(ex.era5.rainDiffPct) / 100)) : 0.1;
  }
  async function loadExtras(lat, lon, onStep, annual) {
    const ex = {}, tasks = [
      ['terrain', () => X.fetchTerrain(lat, lon)],
      ['era5', () => X.fetchEra5(lat, lon, annual || S.site.raw.annual)],
      ['gaez', () => X.fetchGaez(lat, lon)]
    ];
    await Promise.all(tasks.map(async ([k, f]) => { onStep && onStep(k, 'active'); try { ex[k] = await f(); onStep && onStep(k, 'done'); } catch (e) { onStep && onStep(k, 'fail'); } }));
    return ex;
  }
  async function extrasForSample(key) {
    S.extras = XDATA[key] ? JSON.parse(JSON.stringify(XDATA[key])) : null;
    S.extrasState = S.extras ? 'done' : 'loading';
    applyExtras();
    if (S.extras) return;
    const s = S.site.raw, ex = await loadExtras(s.lat, s.lon);
    if (S.siteKey !== key) return;
    S.extras = Object.keys(ex).length ? ex : null; S.extrasState = 'done';
    applyExtras(); compute(); renderAll();
  }

  /* ---------- live study of a new place ---------- */
  async function studyPlace(lat, lon) {
    closeSheet();
    S.progress = { power: 'active' }; location.hash = '#parcela'; showView('parcela', true); renderParcela();
    const P = 'T2M_MAX,T2M_MIN,T2M,PRECTOTCORR,GWETROOT,GWETTOP,EVPTRNS,ALLSKY_SFC_SW_DWN,RH2M,WS2M';
    let raw;
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 90000);
      const r = await fetch(`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=${P}&community=AG&longitude=${lon}&latitude=${lat}&start=20010101&end=20251231&format=JSON`, { signal: ctl.signal });
      clearTimeout(tm); if (!r.ok) throw new Error('POWER ' + r.status);
      raw = window.fsSummarize(await r.json(), lat); raw.lat = lat; raw.lon = lon;
      setStep('power', 'done');
    } catch (e) { S.progress = null; renderParcela(); toast(t('fetchFail'), 9000); return; }
    setStep('ndvi', 'active');
    const ndviP = liveNdvi(lat, lon, (k, n) => setStep('ndvi', 'active', { ndviN: `${k}/${n}` })).then(v => { setStep('ndvi', v ? 'done' : 'fail'); return v; }).catch(() => { setStep('ndvi', 'fail'); return null; });
    const exP = loadExtras(lat, lon, (k, st) => setStep(k, st), raw.annual);
    const [ndvi, ex] = await Promise.all([ndviP, exP]);
    S.custom = { lat, lon };
    const pre = { lat, lon, current: ['maize', 'fallow', 'maize', 'fallow'], opts: { soil: 'loam', slope: 'gentle', residue: 'left', irrigation: 'none', livestock: false, keepMain: true, market: Object.keys(E.CROPS).filter(k => !E.CROPS[k].cover && !E.CROPS[k].fallow) }, weights: Object.assign({}, GOALS.balance) };
    loadSite('custom', raw, ndvi, pre);
    S.extras = Object.keys(ex).length ? ex : null; S.extrasState = 'done'; applyExtras();
    S.progress = null; MAP.zoom = 9;
    compute(); renderAll();
    toast(t('fetchOk', { lat: lat.toFixed(3), lon: lon.toFixed(3) }), 5000);
  }

  /* ---------- location sheet ---------- */
  const LOC = { mode: null, found: null, acc: null, latH: 'N', lonH: 'W', msg: '', msgCls: '' };
  function openSheet() {
    LOC.found = null; LOC.msg = ''; LOC.acc = null;
    renderSheet(); $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
    setTimeout(() => { const b = $('#sheet .locopt'); if (b) b.focus(); }, 30);
  }
  function closeSheet() { const s = $('#sheet'); if (!s || s.hidden) return; s.hidden = true; document.body.style.overflow = ''; const c = $('#placeChip'); if (c) c.focus(); }
  function locPanelHtml() {
    if (LOC.mode === 'type') {
      const hemBtns = (axis, a, b) => `<div class="hem" role="group">${[a, b].map(h => `<button type="button" data-hem="${axis}:${h}" aria-pressed="${LOC[axis + 'H'] === h}">${esc(t('loc_' + h))}</button>`).join('')}</div>`;
      return `<div class="coordgrid">
        <div class="coordrow"><label class="field" for="inLat">${esc(t('loc_lat'))}<input id="inLat" inputmode="decimal" autocomplete="off" placeholder="18.69"></label>${hemBtns('lat', 'N', 'S')}</div>
        <div class="coordrow"><label class="field" for="inLon">${esc(t('loc_lon'))}<input id="inLon" inputmode="decimal" autocomplete="off" placeholder="99.12"></label>${hemBtns('lon', 'E', 'W')}</div></div>
        <p class="helptext">${esc(t('loc_typeHelp'))}</p>`;
    }
    if (LOC.mode === 'paste') return `<label class="field" for="inPaste">${esc(t('loc_pasteLabel'))}<textarea id="inPaste" rows="3" placeholder="${esc(t('loc_pastePh'))}" autocomplete="off" spellcheck="false"></textarea></label>
        <button type="button" class="btn ghost sm" data-action="clip" style="margin-top:8px">${icon('paste')}${esc(t('loc_pasteBtn'))}</button>
        <p class="helptext">${esc(t('loc_pasteHelp'))}</p>`;
    return '';
  }
  function foundHtml() {
    const f = LOC.found; if (!f) return '';
    const gm = `https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}`;
    return `<div class="found"><div class="row">${icon('check')}<span><b>${esc(t('loc_found'))}</b><br><b class="num">${f.lat.toFixed(5)}, ${f.lon.toFixed(5)}</b>${LOC.acc ? ` <span class="muted">· ${esc(t('loc_acc', { m: f0(LOC.acc) }))}</span>` : ''}</span></div>
      <button type="button" class="btn wide" data-action="study">${esc(t('loc_study'))}${icon('arrow')}</button><a class="btn ghost sm" href="${gm}" target="_blank" rel="noopener">${icon('mapa')}${esc(t('loc_check'))}</a></div>`;
  }
  function renderSheet() {
    const farms = ['morelos', 'bajio', 'kansas'];
    $('#sheet').innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="locTitle"><div class="grab"></div>
      <div class="sheethead"><div><h2 id="locTitle">${esc(t('loc_title'))}</h2><p class="sub" style="margin-bottom:0">${esc(t('loc_sub'))}</p></div><button type="button" class="iconbtn" data-action="closeLoc" aria-label="Close">${icon('close')}</button></div>
      <div class="locopts">${[['gps', 'gps'], ['type', 'type'], ['paste', 'paste']].map(([m, ic]) => `<button type="button" class="locopt" data-loc="${m}" aria-pressed="${LOC.mode === m}"><span class="ico">${icon(ic)}</span><b>${esc(t('loc_' + m))}</b><small>${esc(t('loc_' + m + 'D'))}</small></button>`).join('')}</div>
      <div class="locpanel" id="locPanel">${locPanelHtml()}</div>
      <div class="locstatus ${LOC.msgCls}" id="locStatus">${esc(LOC.msg)}</div>
      <div id="locFound">${foundHtml()}</div>
      <div class="samples"><span class="eyebrow">${esc(t('loc_samples'))}</span><div class="chips" style="margin-top:8px">${farms.map(k => `<button type="button" data-farm="${k}">${esc(t('farm' + cap(k)))}</button>`).join('')}</div></div></div>`;
  }
  function setLocMsg(msg, cls) { LOC.msg = msg || ''; LOC.msgCls = cls || ''; const el = $('#locStatus'); if (el) { el.textContent = LOC.msg; el.className = 'locstatus ' + LOC.msgCls; } }
  function setFound(p, acc) {
    if (p && (p.lat < -60 || p.lat > 70)) { LOC.found = null; setLocMsg(t('loc_range'), 'err'); }
    else { LOC.found = p; LOC.acc = acc || null; if (p) setLocMsg(''); }
    $('#locFound').innerHTML = foundHtml();
  }
  function readTyped() {
    const a = ($('#inLat').value || '').trim().replace(',', '.'), b = ($('#inLon').value || '').trim().replace(',', '.');
    if (!a || !b) { setFound(null); setLocMsg(''); return; }
    let la = parseFloat(a), lo = parseFloat(b);
    if (!isFinite(la) || !isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) { setFound(null); setLocMsg(t('loc_badNum'), 'err'); return; }
    if (la > 0 && LOC.latH === 'S') la = -la; if (lo > 0 && LOC.lonH === 'W') lo = -lo;
    setFound({ lat: +la.toFixed(5), lon: +lo.toFixed(5) });
  }
  function readPasted() {
    const s = $('#inPaste').value;
    if (!s.trim()) { setFound(null); setLocMsg(''); return; }
    const p = X.parseLocation(s);
    if (p) { setFound(p); return; }
    setFound(null); setLocMsg(X.isShortLink(s) ? t('loc_short') : t('loc_noParse'), 'err');
  }
  function useGps() {
    setFound(null);
    if (!navigator.geolocation) { setLocMsg(t('loc_gpsFail'), 'err'); return; }
    setLocMsg(t('loc_gpsBusy'), 'busy');
    try {
      navigator.geolocation.getCurrentPosition(pos => { setLocMsg(''); setFound({ lat: +pos.coords.latitude.toFixed(5), lon: +pos.coords.longitude.toFixed(5) }, pos.coords.accuracy); },
        err => setLocMsg(err && err.code === 1 ? t('loc_gpsDenied') : t('loc_gpsFail'), 'err'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    } catch (e) { setLocMsg(t('loc_gpsFail'), 'err'); }
  }

  /* ---------- toast ---------- */
  let toastT = null;
  function toast(msg, ms) { const el = $('#toast'); el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => { el.textContent = ''; }, ms || 4000); }

  /* ---------- render all ---------- */
  function renderAll() { renderBar(); renderParcela(); renderOpciones(); renderMapa(); renderAprende(); showView(VIEW); }

  /* ---------- events ---------- */
  let timer = null;
  function schedule() {
    clearTimeout(timer);
    $('#main').classList.add('busy');
    timer = setTimeout(() => { compute(); renderResults(); const g = activeGoal(); document.querySelectorAll('[data-goal]').forEach(b => b.setAttribute('aria-pressed', b.dataset.goal === g)); const ft = $('#fineTag'); if (ft) ft.textContent = g ? '' : ' · ' + t('g_custom'); $('#main').classList.remove('busy'); }, 120);
  }
  document.addEventListener('click', e => {
    const lb = e.target.closest('[data-lang]'); if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('surco-lang', lang); } catch (x) { } renderAll(); if (!$('#sheet').hidden) renderSheet(); return; }
    const fb = e.target.closest('[data-farm]'); if (fb) { const k = fb.dataset.farm; closeSheet(); loadSite(k, DATA[k], DATA.ndvi[k], PRESETS[k]); S.rainPct = 0; S.dT = 0; S.slopeTouched = false; MAP.zoom = 9; extrasForSample(k); compute(); renderAll(); location.hash = '#parcela'; showView('parcela', true); return; }
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'openLoc') { openSheet(); return; }
      if (a === 'closeLoc') { closeSheet(); return; }
      if (a === 'study' && LOC.found) { studyPlace(LOC.found.lat, LOC.found.lon); return; }
      if (a === 'clip') { const ta = $('#inPaste'); try { navigator.clipboard.readText().then(txt => { ta.value = txt; readPasted(); }).catch(() => { ta.focus(); }); } catch (x) { ta.focus(); } return; }
    }
    if (e.target.id === 'sheet') { closeSheet(); return; }
    const lo = e.target.closest('[data-loc]'); if (lo) { LOC.mode = lo.dataset.loc; LOC.found = null; LOC.msg = ''; renderSheet(); if (LOC.mode === 'gps') useGps(); else { const f = LOC.mode === 'type' ? $('#inLat') : $('#inPaste'); if (f) f.focus(); } return; }
    const hm = e.target.closest('[data-hem]'); if (hm) { const [axis, h] = hm.dataset.hem.split(':'); LOC[axis + 'H'] = h; hm.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === hm)); readTyped(); return; }
    const gb = e.target.closest('[data-goal]'); if (gb) { Object.assign(S.weights, GOALS[gb.dataset.goal]); CRIT.forEach(c => { const r = $('#w_' + c); if (r) { r.value = S.weights[c]; r.nextElementSibling.textContent = S.weights[c]; } }); schedule(); return; }
    const ob = e.target.closest('[data-open]'); if (ob) { const i = +ob.dataset.open; S.open[i] = !S.open[i]; const art = ob.closest('.card'); art.querySelector('.why').hidden = !S.open[i]; ob.setAttribute('aria-expanded', S.open[i]); ob.textContent = S.open[i] ? t('hideDetails') : t('showDetails'); return; }
    const zb = e.target.closest('[data-zoom]'); if (zb) { MAP.zoom = Math.max(5, Math.min(11, MAP.zoom + +zb.dataset.zoom)); drawTiles(); return; }
    if (e.target.closest('#mapPlay')) { const btn = e.target.closest('#mapPlay'); if (MAP.playing) { clearInterval(MAP.playing); MAP.playing = null; } else { MAP.playing = setInterval(() => { MAP.month = (MAP.month + 1) % 120; const r = $('#mapMonth'); if (!r || VIEW !== 'mapa') { clearInterval(MAP.playing); MAP.playing = null; return; } r.value = MAP.month; const L = LAYERS.find(l => l.id === MAP.layer); r.previousElementSibling.textContent = monthAt(MAP.month).toISOString().slice(0, 7); document.querySelector('.legend .muted').textContent = `NASA GIBS · ${L.gibs} · ${layerDate(L, MAP.month)}`; drawTiles(); }, 900); } btn.textContent = MAP.playing ? t('pause') : t('play'); }
    if (e.target.id === 'installBtn' && window.__surcoInstall) { window.__surcoInstall.prompt(); window.__surcoInstall = null; e.target.hidden = true; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('toggle', e => { if (e.target.id === 'farmCard') S.farmOpen = e.target.open; }, true);
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.slot) { S.current[+el.dataset.slot] = el.value; S.open = {}; schedule(); return; }
    if (el.type === 'radio' && el.name in S.opts) { S.opts[el.name] = el.value; if (el.name === 'slope') S.slopeTouched = true; schedule(); return; }
    if (el.id === 'optLivestock') { S.opts.livestock = el.checked; schedule(); return; }
    if (el.id === 'optKeep') { S.opts.keepMain = el.checked; schedule(); return; }
    if (el.dataset.market) { const k = el.dataset.market; S.opts.market = el.checked ? [...new Set([...S.opts.market, k])] : S.opts.market.filter(x => x !== k); schedule(); return; }
    if (el.id === 'mapLayer') { MAP.layer = el.value; const L = LAYERS.find(l => l.id === MAP.layer); MAP.zoom = Math.min(Math.max(MAP.zoom, 5), Math.max(L.z + 2, 6)); renderMap(); return; }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'inLat' || el.id === 'inLon') { readTyped(); return; }
    if (el.id === 'inPaste') { readPasted(); return; }
    if (el.id && el.id.startsWith('w_')) { S.weights[el.id.slice(2)] = +el.value; el.nextElementSibling.textContent = el.value; schedule(); return; }
    if (el.id === 'rainPct') { S.rainPct = +el.value; $('#oRain').textContent = (S.rainPct > 0 ? '+' : '') + S.rainPct + '%'; schedule(); return; }
    if (el.id === 'dT') { S.dT = +el.value; $('#oT').textContent = '+' + S.dT.toFixed(1) + ' °C'; schedule(); return; }
    if (el.id === 'mapMonth') { MAP.month = +el.value; const L = LAYERS.find(l => l.id === MAP.layer); el.previousElementSibling.textContent = monthAt(MAP.month).toISOString().slice(0, 7); document.querySelector('.legend .muted').textContent = `NASA GIBS · ${L.gibs} · ${layerDate(L, MAP.month)}`; clearTimeout(MAP.deb); MAP.deb = setTimeout(drawTiles, 150); }
  });
  document.addEventListener('paste', e => { if (e.target && e.target.id === 'inPaste') setTimeout(readPasted, 0); });
  window.addEventListener('hashchange', () => { const v = viewFromHash(); if (v !== VIEW) showView(v, true); });
  window.addEventListener('resize', () => { clearTimeout(MAP.rs); MAP.rs = setTimeout(drawTiles, 200); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__surcoInstall = e; const b = $('#installBtn'); if (b) b.hidden = false; });
  if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }

  /* ---------- start ---------- */
  VIEW = viewFromHash();
  loadSite('morelos', DATA.morelos, DATA.ndvi.morelos, PRESETS.morelos);
  extrasForSample('morelos');
  compute();
  renderAll();

})();

</script>

</body>
</html>
